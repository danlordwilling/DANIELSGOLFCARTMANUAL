<style>
:root{--bg:#0b1220;--panel:#111827;--panel2:#1e293b;--paper:#fff8e7;--ink:#1e293b;--muted:#64748b;--line:#d0bd8a;--gold:#8a6d2f;--blue:#38bdf8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(145deg,#0f172a,#111827);color:var(--ink)}
button{font:inherit}

.titlewrap small{display:block;color:#cbd5e1;font-size:.71rem;margin-top:.12rem}

p,li{line-height:1.5}

.info{background:#fffdf5;border:1px solid #d7c797;border-radius:14px;padding:.85rem;margin:.8rem 0}
.open-sidebar-inline{border:0;border-radius:13px;background:var(--gold);color:white;padding:.75rem .9rem;font-weight:900}

.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:none}
.overlay.open{display:block}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(92vw,430px);background:#0f172a;color:white;box-shadow:12px 0 35px rgba(0,0,0,.45);display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;gap:.55rem;padding:.75rem;border-bottom:1px solid #334155;min-height:64px}
.drawer-back,.drawer-close{border:1px solid #334155;border-radius:11px;background:#1e293b;color:white;padding:.62rem .72rem;font-weight:900}
.drawer-back:disabled{opacity:.32}
.drawer-title{flex:1;min-width:0;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-body{overflow:auto;padding:.7rem}
.menu-item{display:block;width:100%;text-align:left;border:1px solid #334155;background:#111827;color:white;border-radius:14px;padding:.82rem .85rem;margin:.55rem 0}
.menu-item:active{transform:scale(.99)}
.menu-item .main{display:flex;align-items:center;justify-content:space-between;gap:.7rem;font-weight:900}
.menu-item .sub{display:block;color:#aebfd0;font-size:.78rem;line-height:1.35;margin-top:.25rem}
.menu-group-label{color:#93c5fd;text-transform:uppercase;letter-spacing:.11em;font-size:.68rem;font-weight:900;margin:.85rem .2rem .35rem}
.drawer-search{width:100%;border:1px solid #475569;border-radius:12px;background:#111827;color:white;padding:.75rem .8rem;outline:none;margin-bottom:.35rem}
.drawer-search::placeholder{color:#94a3b8}
.empty{color:#94a3b8;text-align:center;padding:2rem .5rem}

.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-top:1rem}
.quick-actions button{border:1px solid #d2bd81;border-radius:13px;background:#fffdf5;color:#3c321d;padding:.8rem;font-weight:900}

@media print{
  .topbar,.overlay,.quick-actions,.open-sidebar-inline{display:none!important}
  body{background:white}
  .shell{padding:0;max-width:none}
  .paper{box-shadow:none;border:0;border-radius:0;min-height:auto}
}
</style>
</head>

<script>
const DATA = {"pins": {"1": {"title": "Battery Relocation / Permanent Installation", "status": "FUNCTIONAL / FINISHING WORK OPEN", "sections": {"S1": {"title": "Current Battery Installation", "summary": "What is installed and working now.", "articles": {"A1": {"title": "Rear Battery Position", "content": ["Battery has been relocated to the rear seat area.", "Current physical restraint is temporary: ratchet strap plus bungee cord.", "The cart is functional in this location."]}, "A2": {"title": "Main Positive Cable", "content": ["New 4 AWG main positive cable runs from the relocated rear battery to the solenoid.", "This is part of the cart's essential/start wiring, not the accessory fuse-panel feed."]}, "A3": {"title": "Main Negative / Ground", "content": ["New 4 AWG main negative cable runs from the battery to the stock frame ground.", "The cart starts and runs normally with the new positive and negative heavy leads."]}}}, "S2": {"title": "Permanent Finish Work", "summary": "Items still needed to make the relocation permanent.", "articles": {"A1": {"title": "Permanent Battery Hold-Down", "content": ["A rigid permanent hold-down is still required.", "The finished mount should prevent meaningful battery movement during bumps, hard braking and cornering."]}, "A2": {"title": "Terminal Protection", "content": ["Final positive-terminal protection remains open.", "Inspect for accidental contact risk and protect the positive connection appropriately."]}, "A3": {"title": "Cable Routing / Chafe Protection", "content": ["Final routing, chafe protection and terminal security still need a completion inspection.", "Keep heavy cables away from sharp edges, moving parts and exhaust heat."]}}}, "S3": {"title": "Relationship to Other Wiring", "summary": "How the relocated battery interfaces with the rest of the cart.", "articles": {"A1": {"title": "Essential Cart Wiring Isolation", "content": ["With old accessory wiring removed and a new battery connected only to essential cart wiring, normal starting and running returned.", "The cart was later confirmed to run with only the two new 4 AWG heavy leads connected.", "This localized the previous no-crank problem to old accessory/obsolete wiring and/or the old battery."]}, "A2": {"title": "Speedometer Constant-Power Lead", "content": ["The speedometer constant-power lead was identified and retained so it can continue to receive continuous power."]}}}}}, "2": {"title": "Accessory Electrical System / Complete Rewire", "status": "MAJOR ACTIVE PROJECT", "sections": {"S1": {"title": "Main Accessory Power Distribution", "summary": "Battery feed, main fuse, feeder and VW fuse block.", "articles": {"A1": {"title": "Battery Positive Feed", "content": ["Accessory architecture: Battery positive → near-battery main fuse → approximately 8 AWG copper feeder → accessory fuse block.", "Keep essential/start/charge wiring stock or direct-to-battery as practical.", "Starter, jump-stud and other heavy-current paths must not be routed through the ordinary accessory fuse block."]}, "A2": {"title": "Main Accessory Fuse", "content": ["The main accessory feed is currently reported as 20A, pending final confirmation.", "This main fuse is separate from the 12 positions inside the VW fuse block and belongs near the source."]}, "A3": {"title": "8 AWG Feeder", "content": ["Planned architecture uses approximately 8 AWG copper for the main accessory positive feeder.", "Use grommets, loom, strain relief and chafe protection where the feeder passes through the electrical box/body."]}, "A4": {"title": "VW 12-Position Fuse Block", "content": ["One salvaged Volkswagen 12-position fuse block is used.", "The heavy red feed was user-confirmed to feed all 12 fuse positions.", "Correct locking VW fuse terminals were ordered.", "The six populated terminals from one donor block were combined with the other, producing one block with all 12 output wires populated.", "The block is installed in the same area as the previous/factory fuse setup.", "It is temporarily retained with zip ties; permanent mechanical mounting remains open.", "Reported branch fuses: app-controlled LED lights 3A and horn 5A. Both ratings and their exact physical Fuse Locations still need final confirmation."]}}}, "S2": {"title": "Accessory Negative System", "summary": "Dedicated copper negative distribution for added accessories.", "articles": {"A1": {"title": "Negative Architecture", "content": ["Preferred architecture: Battery negative → dedicated 8 AWG copper → isolated negative bus → accessory negative loom → accessories.", "Factory/cart systems retain the stock chassis-ground architecture."]}, "A2": {"title": "Isolated Negative Bus", "content": ["The accessory negative bus is intended to mount to plastic/body structure and remain electrically separate from the frame unless a future reason to bond it is established."]}, "A3": {"title": "Negative Loom Routing", "content": ["A possible layout is to route/mount the accessory negative system on the opposite side of the body from the positive loom for physical separation.", "Final routing remains part of the rewire."]}}}, "S3": {"title": "Front-Cowl Rewire", "summary": "Complete accessory/lighting rebuild under the front cowl.", "articles": {"A1": {"title": "Scope", "content": ["Everything accessory/lighting-related under the front cowl is being ripped out and rebuilt from scratch.", "Factory/essential cart wiring is not automatically removed; identify and preserve it unless there is a reason to replace it."]}, "A2": {"title": "One-Circuit-at-a-Time Method", "content": ["Preferred sequence: fuse block → circuit wiring → switch/control if needed → device → dedicated negative return → test → label → next.", "This is intentionally done one device at a time so the project does not become overwhelming."]}, "A3": {"title": "Protection and Labeling", "content": ["Use loom, grommets, strain relief and proper termination.", "Test and label each completed circuit before moving to the next."]}}}, "S4": {"title": "Roof Wiring Backbone", "summary": "Planned disconnectable roof harness with future capacity.", "articles": {"A1": {"title": "Roof Positive Circuits", "content": ["Planned roof positive circuits originate from the VW fuse block.", "Each future load receives appropriate individual protection."]}, "A2": {"title": "Roof Negative Returns", "content": ["Roof accessory negatives return to the isolated accessory negative bus rather than relying on body/chassis grounding."]}, "A3": {"title": "Roof Disconnect Connector", "content": ["A serviceable disconnect between body wiring and the roof harness is desired.", "Exact connector, conductor count and pin arrangement remain TBD."]}, "A4": {"title": "Front / Rear Branches and Spare Capacity", "content": ["Plan for front and rear roof branches plus spare fused capacity for later additions.", "Exact conductor gauges and physical routing remain TBD."]}}}, "S5": {"title": "Rear Work Light", "summary": "Mounted driver-side rear step; electrical installation pending.", "articles": {"A1": {"title": "Physical Installation", "content": ["A new incandescent 12V rear work/visibility light is physically mounted on the driver-side rear step."]}, "A2": {"title": "Electrical Plan", "content": ["The light is not wired yet.", "Preferred control is a manual independent switch and not the reverse-buzzer circuit.", "A future ON/OFF/AUTO(reverse) arrangement remains brainstorming only."]}}}, "S6": {"title": "Third Brake Light", "summary": "Planned high-mounted brake light on rear roof edge.", "articles": {"A1": {"title": "Physical Plan", "content": ["A CHMSL-style high-mounted brake light is planned at the rear roof edge.", "LED is preferred."]}, "A2": {"title": "Brake-Signal Wiring", "content": ["Use the existing brake-light circuit as a signal.", "If current brake-switch/circuit capacity is uncertain, use that signal to trigger a relay and power the high-mounted light from a separate fused feed."]}}}, "S7": {"title": "Front Focus-Grille / Roof-Light Module", "summary": "Front roof aesthetic/lighting module.", "articles": {"A1": {"title": "Focus Center Grille", "content": ["A Gen-1 Ford Focus center grille is planned under the front roof edge.", "No Ford headlights are part of the plan."]}, "A2": {"title": "Amber Elements", "content": ["The grille includes two amber lamp/reflector elements.", "They can function as passive reflectors before wiring and later as running/marker lights."]}, "A3": {"title": "Future Center LED Bar", "content": ["The grille opening may later hide a compact LED light bar.", "A future light bar gets its own properly fused/switched circuit instead of piggybacking the marker-light circuit."]}}}, "S8": {"title": "External Utility / Jump Studs", "summary": "Heavy-duty external service connection hardware received.", "articles": {"A1": {"title": "Purchased Hardware", "content": ["Exact purchased hardware: RED WOLF Remote Battery Terminal, Amazon ASIN B0F8ZGVP3X.", "Listing describes 3/8-inch / M10 studs with 250A max DC 12V and insulating covers."]}, "A2": {"title": "Mounting", "content": ["Hardware is received but not installed.", "Mount through reinforced plastic body rather than directly to the frame.", "Use backing washers/plate because body plastic alone should not carry jumper-clamp twisting.", "Clearly mark polarity, protect the backside and keep insulating caps installed."]}, "A3": {"title": "Heavy-Current Wiring / Uses", "content": ["Positive and negative remain electrically isolated; the negative stud is connected by cable, not mounting hardware.", "Jump/service current goes directly to battery or heavy-current distribution and never through the 8 AWG accessory panel.", "Intended uses include jump-starting, charging/testing, temporary 12V equipment, winch connection and homemade RV/service adapters."]}}}, "S9": {"title": "Maintainer Connection", "summary": "Dedicated battery charger/maintainer access.", "articles": {"A1": {"title": "Maintainer Connection", "content": ["A dedicated 12V maintainer/charger connection is planned.", "The external utility studs may provide a convenient service connection."]}, "A2": {"title": "Relationship to Solar / Parasitic Drain", "content": ["Maintainer or future solar charging does not replace fixing a parasitic drain.", "Parasitic-drain verification remains part of the completed accessory rewire."]}}}, "S10": {"title": "Fuse Map & Circuit Directory", "summary": "Physical fuse positions run front to rear.", "articles": {"A1": {"title": "Fuse Location 1", "content": ["Fuse Location 1 is position 1 in the 12-position VW block, counted from the front of the cart toward the rear.", "Circuit assignment, fuse rating, wire size and destination remain TBD unless separately confirmed.", "Unused locations should remain unfused and their leads insulated/capped until assigned."]}, "A2": {"title": "Fuse Location 2", "content": ["Fuse Location 2 is position 2 in the 12-position VW block, counted from the front of the cart toward the rear.", "Circuit assignment, fuse rating, wire size and destination remain TBD unless separately confirmed.", "Unused locations should remain unfused and their leads insulated/capped until assigned."]}, "A3": {"title": "Fuse Location 3", "content": ["Fuse Location 3 is position 3 in the 12-position VW block, counted from the front of the cart toward the rear.", "Circuit assignment, fuse rating, wire size and destination remain TBD unless separately confirmed.", "Unused locations should remain unfused and their leads insulated/capped until assigned."]}, "A4": {"title": "Fuse Location 4", "content": ["Fuse Location 4 is position 4 in the 12-position VW block, counted from the front of the cart toward the rear.", "Circuit assignment, fuse rating, wire size and destination remain TBD unless separately confirmed.", "Unused locations should remain unfused and their leads insulated/capped until assigned."]}, "A5": {"title": "Fuse Location 5", "content": ["Fuse Location 5 is position 5 in the 12-position VW block, counted from the front of the cart toward the rear.", "Circuit assignment, fuse rating, wire size and destination remain TBD unless separately confirmed.", "Unused locations should remain unfused and their leads insulated/capped until assigned."]}, "A6": {"title": "Fuse Location 6", "content": ["Fuse Location 6 is position 6 in the 12-position VW block, counted from the front of the cart toward the rear.", "Circuit assignment, fuse rating, wire size and destination remain TBD unless separately confirmed.", "Unused locations should remain unfused and their leads insulated/capped until assigned."]}, "A7": {"title": "Fuse Location 7", "content": ["Fuse Location 7 is position 7 in the 12-position VW block, counted from the front of the cart toward the rear.", "Circuit assignment, fuse rating, wire size and destination remain TBD unless separately confirmed.", "Unused locations should remain unfused and their leads insulated/capped until assigned."]}, "A8": {"title": "Fuse Location 8", "content": ["Fuse Location 8 is position 8 in the 12-position VW block, counted from the front of the cart toward the rear.", "Circuit assignment, fuse rating, wire size and destination remain TBD unless separately confirmed.", "Unused locations should remain unfused and their leads insulated/capped until assigned."]}, "A9": {"title": "Fuse Location 9", "content": ["Fuse Location 9 is position 9 in the 12-position VW block, counted from the front of the cart toward the rear.", "Circuit assignment, fuse rating, wire size and destination remain TBD unless separately confirmed.", "Unused locations should remain unfused and their leads insulated/capped until assigned."]}, "A10": {"title": "Fuse Location 10", "content": ["Fuse Location 10 is position 10 in the 12-position VW block, counted from the front of the cart toward the rear.", "Circuit assignment, fuse rating, wire size and destination remain TBD unless separately confirmed.", "Unused locations should remain unfused and their leads insulated/capped until assigned."]}, "A11": {"title": "Fuse Location 11", "content": ["Fuse Location 11 is position 11 in the 12-position VW block, counted from the front of the cart toward the rear.", "Circuit assignment, fuse rating, wire size and destination remain TBD unless separately confirmed.", "Unused locations should remain unfused and their leads insulated/capped until assigned."]}, "A12": {"title": "Fuse Location 12", "content": ["Fuse Location 12 is position 12 in the 12-position VW block, counted from the front of the cart toward the rear.", "Circuit assignment, fuse rating, wire size and destination remain TBD unless separately confirmed.", "Unused locations should remain unfused and their leads insulated/capped until assigned."]}}}}}, "3": {"title": "Cold-Start / Throttle-Bog Diagnosis", "status": "OPEN", "sections": {"S1": {"title": "Symptoms", "summary": "Documented operating behavior.", "articles": {"A1": {"title": "Warm-Start Behavior", "content": ["Around 70°F and warmer, choke is usually not needed.", "Slowly press the pedal until the starter spins, then back off/find the point where the engine catches.", "Hold that point and gradually press toward full pedal. After roughly 30 seconds of high idle, the cart is generally reliable."]}, "A2": {"title": "Cold-Start Behavior", "content": ["Cold weather usually requires choke.", "The usable throttle window is narrower and sometimes only the starter spins without the engine coughing/firing.", "Repeated attempts can drain the battery."]}, "A3": {"title": "Low-Throttle Bog", "content": ["Gradual throttle application works much better than rapid application.", "A strong acceleration sweet spot exists around roughly 1/4 throttle, with a bog immediately before it.", "This behavior predates the BLT-0100 belt."]}}}, "S2": {"title": "Diagnostic Status", "summary": "What is known versus not yet proven.", "articles": {"A1": {"title": "Known Observations", "content": ["Warm running is generally stable once the cart is through the initial throttle-sensitive range.", "Rapid throttle can produce chugging/bogging/stalling.", "The BLT-0100 belt did not create the symptom."]}, "A2": {"title": "Still To Verify", "content": ["Exact cause remains unresolved.", "Potential areas to investigate include carburetion/fuel delivery, choke operation, governor/throttle linkage and ignition behavior.", "Do not assume the carburetor is the sole cause."]}}}, "S3": {"title": "Maintenance Clues", "summary": "Use maintenance findings as diagnostic evidence.", "articles": {"A1": {"title": "Spark Plug Evidence", "content": ["Record spark-plug deposits, color and wear during annual service because they may help diagnose mixture/combustion behavior."]}, "A2": {"title": "Fuel / Intake Evidence", "content": ["Record fuel-line condition, pump condition, carburetor seepage and intake leaks/clamp issues when found."]}}}}}, "4": {"title": "BLT-0100 Belt / Clutch Monitoring", "status": "MONITORING", "sections": {"S1": {"title": "Installed Hardware", "summary": "Current belt/clutch hardware.", "articles": {"A1": {"title": "BLT-0100 Drive Belt", "content": ["Current drive belt is the Red Hawk BLT-0100 Severe Duty.", "Published fitment includes Club Car DS OHV 1992+ and cross references Club Car 1016203 / 1017186.", "One published dimension is approximately 1 inch × 31-1/2 inch OD."]}, "A2": {"title": "Primary Clutch", "content": ["Aftermarket OEM-style primary clutch is installed."]}, "A3": {"title": "Secondary Clutch / Spring / Bolt", "content": ["Secondary clutch has been replaced and uses a red higher-torque spring.", "Secondary retaining bolt reference: 5/16-18 UNC × 3/4 inch; Grade 8 acceptable; reuse OEM washer if good; blue Loctite 243 preferred or 242 acceptable.", "Final tightening should be by hand/torque wrench, not a large impact."]}}}, "S2": {"title": "Performance Results", "summary": "Observed behavior after the BLT-0100 installation.", "articles": {"A1": {"title": "Acceleration / Pulling", "content": ["Acceleration and climbing/pulling improved significantly.", "A small trailer became essentially unnoticeable under acceleration/climbing and was mainly noticeable during braking."]}, "A2": {"title": "RPM / CVT Behavior", "content": ["Engine reaches near-max RPM early while vehicle speed continues increasing as the CVT shifts.", "The same general behavior existed before, but operation is smoother and stronger with the BLT-0100."]}, "A3": {"title": "Takeoff / Backshift", "content": ["Takeoff is firm/aggressive but there is no grabbing, shuddering or slip.", "After letting off and reapplying before a complete stop, pull resumes immediately and smoothly."]}}}, "S3": {"title": "Open Monitoring Items", "summary": "Items to watch rather than immediately repair.", "articles": {"A1": {"title": "Belt Wear", "content": ["Current inspection passed: no abnormal fraying, damage, glazing or cracking."]}, "A2": {"title": "Secondary Full Opening", "content": ["Secondary full opening at high speed/high load has not been visually verified.", "Priority is lower because performance/top-speed behavior appears generally normal."]}, "A3": {"title": "Idle Squeak", "content": ["A new squeak at idle appears near the primary clutch center/belt-contact area.", "This remains open for inspection."]}, "A4": {"title": "Same-Road Top-Speed Check", "content": ["Top speed appears similar to before, but a same-road comparison has not been completed."]}}}}}, "5": {"title": "Front-End Alignment", "status": "OPEN", "sections": {"S1": {"title": "Current State", "summary": "Recent steering work and remaining alignment task.", "articles": {"A1": {"title": "Tie-Rod Ends", "content": ["Tie-rod ends were replaced recently."]}, "A2": {"title": "Alignment", "content": ["Front-end alignment remains open after the tie-rod-end replacement."]}}}, "S2": {"title": "High-Wear Front End", "summary": "Extra inspection because of the modified front suspension.", "articles": {"A1": {"title": "Known Stress Factors", "content": ["The cart has a 6-inch Jake's spindle lift, wheel spacers, hydraulic front brakes and stiffer springs.", "These changes add stress/leverage to the front end."]}, "A2": {"title": "Bushing History", "content": ["Front bushings have been replaced approximately 3–4 times and remain a known high-wear area."]}}}}}, "6": {"title": "Tires / Wheel Replacement", "status": "ACTIVE", "sections": {"S1": {"title": "Current Tire Incident", "summary": "Front passenger tire failure.", "articles": {"A1": {"title": "Sept. 8, 2026 Failure", "content": ["Front passenger 22x10-10 tire popped on Sept. 8, 2026."]}}}, "S2": {"title": "Ordered Replacement Pair", "summary": "Two new front wheel/tire assemblies.", "articles": {"A1": {"title": "Antego ATW-045 Set", "content": ["Ordered: Antego ATW-045 20x10.00-10 golf-cart tires on 10x7 matte-black wheels, set of two.", "Expected arrival: Sept. 10, 2026.", "The intent was to buy four, but the listing was actually a set of two."]}}}, "S3": {"title": "Installation Plan", "summary": "Temporary mixed front/rear diameter plan.", "articles": {"A1": {"title": "Front Axle Installation", "content": ["Install both new 20x10-10 assemblies on the front axle.", "Keep the matched 22x10-10 pair on the rear temporarily.", "Do not mix 20-inch and 22-inch tires on the same axle."]}, "A2": {"title": "Why This Arrangement", "content": ["The failed tire is on the front.", "The cart is rear-wheel drive, so keeping a matched pair on the drive axle is useful.", "The smaller front pair will lower the nose roughly 1 inch while the 6-inch lift provides clearance."]}}}, "S4": {"title": "Evaluation Before Ordering Rear Pair", "summary": "What to inspect on arrival and after installation.", "articles": {"A1": {"title": "Quality / Fit Checks", "content": ["Inspect bead/air retention, valve stems, tire/wheel quality, roundness, vibration, full-lock clearance and offset/backspacing."]}, "A2": {"title": "Road Test", "content": ["Evaluate steering feel and handling before ordering the second pair."]}, "A3": {"title": "Long-Term Plan", "content": ["If the first pair proves good, order two more identical assemblies for the rear.", "Long-term target is 20x10-10 on all four corners."]}}}, "S5": {"title": "Saved Tire Options", "summary": "Previously considered alternatives.", "articles": {"A1": {"title": "SunF A021 20x10-10", "content": ["Previously saved option: SunF A021 20x10-10 hardpack race-sport ATV/UTV tire, set of four.", "Hardpack/pavement/turf oriented rather than a deep-mud tire."]}, "A2": {"title": "Other Wheel/Tire Option", "content": ["A more expensive wheel/tire option was saved mainly because of the rims; exact details remain unresolved in the manual."]}}}}}, "7": {"title": "Exact Kawasaki Engine Identification", "status": "LOW PRIORITY / UNCONFIRMED", "sections": {"S1": {"title": "Current Identification Status", "summary": "What is known today.", "articles": {"A1": {"title": "Known Engine Description", "content": ["The cart has historically been described as having the stock Kawasaki gasoline engine.", "Exact engine model has not been physically confirmed."]}}}, "S2": {"title": "Expected Stock Reference", "summary": "Manufacturer documentation clue.", "articles": {"A1": {"title": "FE290 Expectation", "content": ["2003 Club Car DS gasoline documentation points toward a Kawasaki FE290 OHV engine.", "Expected stock engine assembly reference: Club Car 101953901.", "Treat this as assumed stock, not a confirmed installed engine."]}}}, "S3": {"title": "What Will Confirm It", "summary": "Evidence needed before locking specifications.", "articles": {"A1": {"title": "Physical Identification", "content": ["Confirm with engine ID/label, casting/part number or sufficiently clear physical identification.", "Only after that should FE290-specific oil, spark-plug and internal-engine specifications be marked confirmed."]}}}}}, "8": {"title": "Generator Mode / Auxiliary Alternator & Inverter", "status": "FUTURE CONCEPT", "sections": {"S1": {"title": "System Goal", "summary": "Preserve stock operation while adding on-demand generator capability.", "articles": {"A1": {"title": "Normal Mode", "content": ["Keep the stock starter/generator intact for normal cart operation."]}, "A2": {"title": "Generator Mode", "content": ["Future switchable mode would use an auxiliary alternator to support battery/inverter loads while handling stock charging duty appropriately, then return to normal operation."]}}}, "S2": {"title": "Auxiliary Alternator", "summary": "Future belt-driven charging source.", "articles": {"A1": {"title": "Target Alternator", "content": ["Concept target is a small internally regulated 12V alternator around 35–60A."]}, "A2": {"title": "Drive / Pulley Concept", "content": ["Use an added pulley/belt and choose a ratio that provides useful charging at stationary idle/high-idle.", "Exact hardware and ratio remain conceptual."]}}}, "S3": {"title": "Inverter", "summary": "120V tool-power concept.", "articles": {"A1": {"title": "Inverter Sizing Reality", "content": ["A 2,000W pure-sine inverter has been discussed.", "A 35–60A alternator cannot continuously supply 2,000W; the battery would buffer short peaks and the continuous load must respect charging capacity."]}}}, "S4": {"title": "Target Loads", "summary": "Practical loads before stretch goals.", "articles": {"A1": {"title": "Initial Tools", "content": ["Ordinary corded handheld tools such as saws, drills and grinders as applicable.", "Small drill press and small air compressor are also target loads."]}, "A2": {"title": "Far-Future Welder", "content": ["A small 125-class flux-core welder is a far-future stretch goal and is not a present sizing target."]}}}}}, "9": {"title": "Winch Rewire", "status": "OUT OF SERVICE", "sections": {"S1": {"title": "Winch Hardware", "summary": "Current known physical setup.", "articles": {"A1": {"title": "Rear Winch", "content": ["Older unidentified rear winch is mounted under the rear et unless another Pin/article says otherwise.", "Keep manufacturer stock information labeled as assumed until physically confirmed."]}}}, "67": {"title": "High-Mounted Brake Light", "articles": {"A1": {"title": "Current Reference", "content": ["This component is part of the master breakdown.", "Exact installed details are not fully documented yet unless another Pin/article says otherwise.", "Keep manufacturer stock information labeled as assumed until physically confirmed."]}}}, "68": {"title": "Focus Center-Grille/Amber Elements", "articles": {"A1": {"title": "Current Reference", "content": ["This component is part of the master breakdown.", "Exact installed details are not fully documented yet unless another Pin/article says otherwise.", "Keep manufacturer stock information labeled as assumed until physically confirmed."]}}}, "69": {"title": "Roof Electrical Backbone", "articles": {"A1": {"title": "Current Reference", "content": ["This component is part of the master breakdown.", "Exact installed details are not fully documented yet unless another Pin/article says otherwise.", "Keep manufacturer stock information labeled as assumed until physically confirmed."]}}}, "70": {"title": "Solar Charging System", "articles": {"A1": {"title": "Current Reference", "content": ["This component is part of the master breakdown.", "Exact installed details are not fully documented yet unless another Pin/article says otherwise.", "Keep manufacturer stock information labeled as assumed until physically confirmed."]}}}, "71": {"title": "Battery Maintainer Connection", "articles": {"A1": {"title": "Current Reference", "content": ["This component is part of the master breakdown.", "Exact installed details are not fully documented yet unless another Pin/article says otherwise.", "Keep manufacturer stock information labeled as assumed until physically confirmed."]}}}, "72": {"title": "Auxiliary Alternator", "articles": {"A1": {"title": "Current Reference", "content": ["This component is part of the master breakdown.", "Exact installed details are not fully documented yet unless another Pin/article says otherwise.", "Keep manufacturer stock information labeled as assumed until physically confirmed."]}}}, "73": {"title": "Inverter", "articles": {"A1": {"title": "Current Reference", "content": ["This component is part of the master breakdown.", "Exact installed details are not fully documented yet unless another Pin/article says otherwise.", "Keep manufacturer stock information labeled as assumed until physically confirmed."]}}}, "74": {"title": "Misc Fasteners/Hardware", "articles": {"A1": {"title": "Saved Hardware References", "content": ["This absorbs the general hardware portion of the old Parts, Hardware & Specifications chapter.", "Common service supplies include blue threadlocker, anti-seize, dielectric grease, electrical terminals, heat-shrink, fuel hose and clamps.", "Grade 8 bolt kit has been purchased for future work."]}, "A2": {"title": "Identification Rule", "content": ["Do not invent unconfirmed part numbers or specifications.", "Record exact part numbers, casting numbers, dimensions and sources as they are physically confirmed."]}}}}, "maintenance": {"A1": {"title": "Before Use / Every Drive", "content": ["Quick check: tires, visible leaks, brakes, steering feel, loose wheel/hub hardware, unusual belt/clutch noise, battery security/cables and anything hanging near exhaust.", "This is especially important because of the lift, spacers, hydraulic front brakes, higher speed and accessory wiring."]}, "A2": {"title": "Monthly", "content": ["Check engine oil level, cooling-air intake, exhaust/muffler debris, tire pressure/condition, battery terminals, main 4 AWG cable security, accessory wiring/fuse block, visible fuel lines and obvious leaks."]}, "A3": {"title": "Every 250 Miles or 3 Months — Cart-Specific / Conservative", "content": ["Inspect front suspension/lift hardware, wheel spacers, tie-rod ends, steering play, hydraulic front-brake hoses/fittings, wheel bearings/hubs, belt/clutch area, battery hold-down, accessory cable chafe, exhaust clearance and added hardware."]}, "A4": {"title": "Every 500 Miles or 6 Months", "content": ["Inspect front alignment/camber, electrical wiring/connections, rear brake shoes/cables as applicable, hydraulic front brakes, brake linkage, accelerator/shifter pivots, front suspension lubrication, steering, belt/clutches, fuel lines, intake clamps/hoses, leaks and general hardware."]}, "A5": {"title": "Every 1,000 Miles or 12 Months — Major Service", "content": ["A5.1 Engine oil & filter — change and leak-check; exact oil spec waits for engine confirmation.", "A5.2 Air intake & filter — inspect/replace filter, clean air box, inspect hoses/clamps.", "A5.3 Spark plug — inspect/replace; record condition for P3.", "A5.4 Fuel system — filters, pump, hoses, clamps, tank/pickup, cap seal, carb exterior.", "A5.5 Drive belt & clutches — inspect BLT-0100 and both clutches; condition determines replacement.", "A5.6 Starter/generator & belt — inspect belt, alignment, mounts, terminals, noise and charging.", "A5.7 Battery & main electrical — inspect relocated battery, hold-down, 4 AWG cables, terminals, routing and frame ground.", "A5.8 Accessory electrical — inspect VW block, fuse map, negative system, loom/grommets and heat clearance.", "A5.9 Front suspension/lift/steering — inspect lift, bushings, tie rods, steering, spacers, hubs and alignment.", "A5.10 Wheels/tires/hubs/bearings — inspect tire/wheel condition, pressure, lugs and bearing play/noise.", "A5.11 Brakes — inspect front hydraulic system, rear brake system and parking brake.", "A5.12 Transaxle/differential — inspect leaks, lubricant level, noise and mounts; baseline history remains unknown.", "A5.13 Exhaust/engine mounting — inspect muffler, joints, mounts and nearby wires/hoses.", "A5.14 Body/roof/added hardware — inspect windshield, roof, seat belts, hitch, work light, winch mount and accessory mounts.", "A5.15 Final operational test — cold start, charging, idle, throttle, steering, brakes, accessories, progressively faster road test and leak recheck.", "Record date, mileage, parts/fluids used, findings, repairs needed and next due date/mileage."]}, "A6": {"title": "Every 2,000 Miles or 24 Months", "content": ["Deep service/baseline: fuel filters, transaxle lubricant, spark plug, clutch inspection, starter/generator inspection, suspension/bushings/shocks, steering, rear brakes, hydraulic-brake-fluid assessment, high-current connections and body/roof/accessory mounts."]}, "A7": {"title": "Seasonal / Storage", "content": ["Check fuel condition, battery maintenance/charging, tire pressure, engine/exhaust cleanliness and corrosion/rodent damage.", "Perform a return-to-service inspection."]}, "A8": {"title": "After Hard Use / Abnormal Event — Cart-Specific", "content": ["After towing, sustained high speed, hard off-road use, impact, heavy winching, brake overheating or new vibration/noise: recheck wheels/spacers, front-end hardware, belt/clutches, brakes, exhaust/wire contact, hitch/winch mounts and battery/high-current connections."]}, "A9": {"title": "Unknown Baseline / Catch-Up Maintenance", "content": ["Keep uncertain-history items flagged until serviced once and documented.", "Current examples: transaxle lubricant, rear-brake service history, starter/generator service history, internal-engine history beyond known valve adjustment and some wheel-bearing/suspension dates."]}}, "pages": {"vehicle": {"title": "Vehicle Information", "content": ["Make: Club Car", "Model: DS", "Year: 2003", "Fuel: gasoline", "Purchase date: August 28, 2024", "Engine: Kawasaki gasoline engine; exact model not physically confirmed. 2003 documentation suggests FE290 OHV.", "Estimated total mileage: at least 6,000+ miles; roughly 1,000+ personal miles.", "Governor modified/bypassed/tweaked; exact method unknown.", "Personal best speed: 32 mph; prior alleged/estimated top speed about 35 mph.", "Idle modification allows the engine to remain running; key and kill switch still cut power.", "Neutral effectively acts like service/warm-up mode because of the idle modification."]}, "attention": {"title": "Pay Attention / Do Later", "content": ["Secondary clutch full-opening / full-shift observation.", "Idle squeak near primary clutch/belt center.", "Optional same-road top-speed verification.", "Permanent VW fuse-block mounting replacing zip ties.", "Confirm main 20A accessory fuse plus reported 3A LED and 5A horn fuses and their exact Fuse Locations.", "Winch internal trace and wiring sizing.", "Focus-grille placement mockup before drilling.", "Solar roof mockup and charge-controller profile verification.", "Evaluate new Antego front wheel/tire pair after arrival.", "Permanent battery hold-down and final cable/terminal protection."]}, "projects": {"title": "Projects / Work History", "content": ["Project 9 — Battery replacement/relocation: no-crank resolved; 4 AWG mains complete; rear relocation functional; permanent hold-down remains.", "Project 10 — Old Wiring Identification & Cleanup: essential operation proven on two heavy main leads; obsolete wiring removed; most smaller leads labeled; parasitic test waits for completed accessory rewire.", "Project 11 — 12V Fuse Panel / Accessory Cleanup: VW 12-slot block, 8 AWG positive feeder, isolated 8 AWG negative bus, front-cowl rewire, rear/roof accessories, maintainer and external studs.", "Project 12 — Generator Mode: future auxiliary alternator/inverter concept while preserving stock starter/generator.", "Project 13 — Winch: rear winch currently out of service after muffler-melted wiring; internal trace required before rewire."]}, "brainstorm": {"title": "Brainstorming / Future Ideas", "content": ["50W roof solar charging/maintenance if panel fit and controller profile are suitable.", "Center LED light bar behind Focus grille.", "Optional rear marker lights / future rear work-light AUTO(reverse) mode.", "Central auxiliary switch/control panel.", "Master accessory disconnect/contactor.", "Front/rear 12V or USB-C service outlets.", "Rear utility/work station.", "Reinforced front/rear recovery points.", "Tachometer.", "Oil or cylinder-head temperature gauge for Generator Mode.", "Near-battery high-current distribution studs/bus if branch count grows.", "Anderson/polarized quick connector for winch/service power.", "Homemade adapters from external utility studs for RV/12V bench testing."]}, "history": {"title": "Modification & Repair History", "content": ["6-inch Jake's spindle lift installed with hydraulic front brakes, wheel spacers and stiffer front springs.", "Front hubs/bearings, shocks, bushings and tie-rod ends have been serviced/replaced; bushings are a recurring wear item.", "Aftermarket steering wheel installed.", "LED headlights, turn signals, horn, underglow, roof, windshield/manual wiper and seat belts installed.", "Rear hitch fabricated from 1/4-inch plate.", "Fuel cap with level gauge installed.", "Carburetor failure caused the cart's major breakdown; carburetor was replaced and is now treated preventively.", "Fuel pump, fuel filters, air filter, oil, oil filter and spark plug are generally serviced yearly.", "Voltage regulator replaced after failure.", "Primary and secondary clutches replaced; red higher-torque secondary spring installed.", "BLT-0100 Severe Duty drive belt installed with major performance improvement.", "Secondary clutch retaining bolt was previously snapped during reinstall with a large impact; correct bolt/threadlocker method is now documented.", "Battery relocated rearward and 4 AWG main cables installed.", "VW 12-position accessory fuse block installed.", "Old inaccurate voltage gauge replaced by Sunpro CP8205; charging indication now normal.", "Rear work light mounted but not wired.", "Winch wiring later melted on muffler and winch is currently out of service."]}, "issues": {"title": "Known Issues / Operating Behavior", "content": ["Cold start is throttle-sensitive and usually requires choke in cold weather.", "Rapid throttle application can cause a low-throttle bog/chug/stall; gradual application works.", "A strong acceleration sweet spot exists around roughly 1/4 throttle.", "Idle squeak near the primary clutch/belt center remains open.", "Front-end alignment remains open after tie-rod-end replacement.", "Front passenger 22x10-10 tire popped Sept. 8, 2026; replacement front pair is on order.", "Winch is out of service because its external wiring melted on the muffler.", "Transaxle lubricant history and some rear-brake/starter-generator service history remain unknown-baseline items.", "Previous no-crank/accessory-wiring problem is resolved.", "Previous 18V+ voltmeter reading is resolved as a bad old gauge."]}}};


const PIN_SUMMARIES = {
  "1":"Rear battery relocation is working; permanent hold-down, terminal protection, and final cable finishing are still open.",
  "2":"Major active electrical project covering the VW fuse block, negative bus, front-cowl rewire, roof wiring, rear work light, utility studs, and fuse mapping.",
  "3":"Tracks the difficult cold-start routine, low-throttle bog, choke behavior, and the still-unconfirmed root cause.",
  "4":"Tracks the major performance improvement from the BLT-0100, plus remaining checks like the idle squeak, full secondary opening, and optional speed verification.",
  "5":"Tie-rod ends are replaced, but alignment is still open; also tracks the front end as a known high-wear area.",
  "6":"Tracks the failed front tire, the new 20x10-10 front pair, fitment testing, and the plan to move to 20x10-10 on all four corners if they work well.",
  "7":"Keeps the engine model unconfirmed until physical identification is done; 2003 documentation suggests FE290 but that is still only an expected-stock reference.",
  "8":"Future concept for adding an auxiliary alternator and inverter while keeping the stock starter/generator for normal operation.",
  "9":"Winch is currently out of service after its wiring melted on the muffler; internal tracing and a safer rewire are needed before reuse.",
  "10":"The cart’s encyclopedia/reference system, containing the detailed parts breakdown and scheduled maintenance structure."
};

const overlay = document.getElementById('overlay');
const drawerItems = document.getElementById('drawerItems');
const drawerTitle = document.getElementById('drawerTitle');
const drawerBack = document.getElementById('drawerBack');
const drawerSearch = document.getElementById('drawerSearch');
const content = document.getElementById('content');

let menuStack = [{type:'root', title:'Manual'}];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function rootItems() {
  return [
    {kind:'content', id:'vehicle', title:'Vehicle Information', sub:'Cart identity and core operating reference'},
    {kind:'menu', id:'pins', title:'Pins', sub:'1–10 • open Pin → Subsection → Article'},
    {kind:'menu', id:'master', title:'Master Reference', sub:'General Parts Breakdown and Scheduled Maintenance'},
    {kind:'content', id:'attention', title:'Pay Attention / Do Later', sub:'Open items that are not their own active Pin'},
    {kind:'content', id:'projects', title:'Projects / Work History', sub:'Project 9–13 history and status'},
    {kind:'content', id:'brainstorm', title:'Brainstorming / Future Ideas', sub:'Ideas that are not automatically active projects'},
    {kind:'content', id:'history', title:'Modification & Repair History', sub:'Preserved work and modification record'},
    {kind:'content', id:'issues', title:'Known Issues / Operating Behavior', sub:'Current symptoms, quirks and resolved issues'}
  ];
}

function getMenuItems(node) {
  if(node.type === 'root') return rootItems();

  if(node.type === 'pins') {
    return Object.entries(DATA.pins).map(([num,p]) => ({
      kind:'menu',
      id:num,
      title:`${num} — ${p.title}`,
      sub:PIN_SUMMARIES[num] || p.status,
      nextType:'pin'
    }));
  }

  if(node.type === 'pin') {
    const p = DATA.pins[node.id];
    return Object.entries(p.sections).map(([sid,s]) => ({
      kind:'menu',
      id:sid,
      title:`${sid} — ${s.title}`,
      sub:s.summary || (s.articles && Object.values(s.articles)[0]?.content?.[0]) || '',
      nextType:'pinSection',
      pin:node.id
    }));
  }

  if(node.type === 'pinSection') {
    const s = DATA.pins[node.pin].sections[node.id];
    return Object.entries(s.articles).map(([aid,a]) => ({
      kind:'article',
      id:aid,
      title:`${aid} — ${a.title}`,
      sub:(a.content && a.content.length ? a.content[0] : 'Open full article'),
      articleType:'pinArticle',
      pin:node.pin,
      section:node.id
    }));
  }

  if(node.type === 'master') {
    return [
      {kind:'menu', id:'breakdown', title:'General Parts Breakdown', sub:'Component-by-component reference; old standalone service chapters are absorbed here', nextType:'breakdown'},
      {kind:'menu', id:'maintenance', title:'Scheduled Maintenance', sub:'A1–A9 • mileage and/or elapsed time only', nextType:'maintenance'}
    ];
  }

  if(node.type === 'breakdown') {
    return Object.entries(DATA.breakdown).map(([num,c]) => ({
      kind:'menu', id:num, title:`${num} — ${c.title}`, sub:'Open component articles', nextType:'component'
    }));
  }

  if(node.type === 'component') {
    const c = DATA.breakdown[node.id];
    return Object.entries(c.articles).map(([aid,a]) => ({
      kind:'article',
      id:aid,
      title:`${aid} — ${a.title}`,
      sub:(a.content && a.content.length ? a.content[0] : 'Open full article'),
      articleType:'componentArticle',
      component:node.id
    }));
  }

  if(node.type === 'maintenance') {
    return Object.entries(DATA.maintenance).map(([aid,a]) => ({
      kind:'article',
      id:aid,
      title:`${aid} — ${a.title}`,
      sub:(a.content && a.content.length ? a.content[0] : 'Open full maintenance article'),
      articleType:'maintenanceArticle'
    }));
  }

  return [];
}

function renderDrawer() {
  const node = menuStack[menuStack.length-1];
  drawerTitle.textContent = node.title;
  drawerBack.disabled = menuStack.length <= 1;
  drawerSearch.value = '';
  renderDrawerItems('');
}

function renderDrawerItems(query) {
  const node = menuStack[menuStack.length-1];
  const q = (query || '').trim().toLowerCase();
  const items = getMenuItems(node).filter(x =>
    !q || x.title.toLowerCase().includes(q) || (x.sub||'').toLowerCase().includes(q)
  );

  if(!items.length) {
    drawerItems.innerHTML = '<div class="empty">No matches in this menu.</div>';
    return;
  }

  drawerItems.innerHTML = items.map((x,i) => `
    <button class="menu-item" data-i="${i}">
      <span class="main"><span>${esc(x.title)}</span><span>${x.kind==='content'||x.kind==='article' ? '›' : '›'}</span></span>
      ${x.sub ? `<span class="sub">${esc(x.sub)}</span>` : ''}
    </button>
  `).join('');

  [...drawerItems.querySelectorAll('.menu-item')].forEach((btn,idx) => {
    btn.onclick = () => handleMenuItem(items[idx]);
  });
}

function handleMenuItem(item) {
  if(item.kind === 'content') {
    renderSimplePage(item.id);
    closeDrawer();
    return;
  }
  if(item.kind === 'article') {
    renderArticle(item);
    closeDrawer();
    return;
  }

  if(item.id === 'pins') {
    menuStack.push({type:'pins', title:'Pins'});
  } else if(item.id === 'master') {
    menuStack.push({type:'master', title:'Master Reference'});
  } else if(item.nextType === 'pin') {
    const p = DATA.pins[item.id];
    menuStack.push({type:'pin', id:item.id, title:`${item.id} — ${p.title}`});
  } else if(item.nextType === 'pinSection') {
    const s = DATA.pins[item.pin].sections[item.id];
    menuStack.push({type:'pinSection', pin:item.pin, id:item.id, title:`${item.id} — ${s.title}`});
  } else if(item.nextType === 'breakdown') {
    menuStack.push({type:'breakdown', title:'General Parts Breakdown'});
  } else if(item.nextType === 'component') {
    const c = DATA.breakdown[item.id];
    menuStack.push({type:'component', id:item.id, title:`${item.id} — ${c.title}`});
  } else if(item.nextType === 'maintenance') {
    menuStack.push({type:'maintenance', title:'Scheduled Maintenance'});
  }
  renderDrawer();
}

function renderSimplePage(id) {
  const p = DATA.pages[id];
  content.innerHTML = `
    <div class="crumb">Manual</div>
    <h2>${esc(p.title)}</h2>
    <ul class="content-list">${p.content.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <div class="quick-actions">
      <button onclick="openDrawerAt('pins')">Open Pins</button>
      <button onclick="openDrawerAt('master')">Open Master Reference</button>
    </div>
  `;
  remember({kind:'simple', id});
}

function renderArticle(item) {
  let title='', body=[], crumb='';
  if(item.articleType === 'pinArticle') {
    const p=DATA.pins[item.pin], s=p.sections[item.section], a=s.articles[item.id];
    title = `${item.id} — ${a.title}`;
    body = a.content;
    crumb = `Pins › ${item.pin} — ${p.title} › ${item.section} — ${s.title}`;
  } else if(item.articleType === 'componentArticle') {
    const c=DATA.breakdown[item.component], a=c.articles[item.id];
    title = `${item.id} — ${a.title}`;
    body = a.content;
    crumb = `Master Reference › General Parts Breakdown › ${item.component} — ${c.title}`;
  } else if(item.articleType === 'maintenanceArticle') {
    const a=DATA.maintenance[item.id];
    title = `${item.id} — ${a.title}`;
    body = a.content;
    crumb = 'Master Reference › Scheduled Maintenance';
  }
  content.innerHTML = `
    <div class="crumb">${esc(crumb)}</div>
    <h2>${esc(title)}</h2>
    <div class="info"><strong>Full article details</strong><br>This is the deepest level of this item in the manual.</div>
    <ul class="content-list">${body.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <button class="open-sidebar-inline" onclick="document.getElementById('menuBtn').click()">☰ Open Menu</button>
  `;
  remember({kind:'article', item});
}

function remember(obj) {
  try{localStorage.setItem('danielsClubCarManualViewV2', JSON.stringify(obj));}catch(e){}
}

function restore() {
  try {
    const raw=localStorage.getItem('danielsClubCarManualViewV2');
    if(!raw) return false;
    const v=JSON.parse(raw);
    if(v.kind==='simple' && DATA.pages[v.id]) { renderSimplePage(v.id); return true; }
    if(v.kind==='article' && v.item) { renderArticle(v.item); return true; }
  } catch(e) {}
  return false;
}

function openDrawer() {
  overlay.classList.add('open');
  renderDrawer();
}
function closeDrawer() {
  overlay.classList.remove('open');
}
function openDrawerAt(type) {
  if(type==='pins') menuStack=[{type:'root',title:'Manual'},{type:'pins',title:'Pins'}];
  else if(type==='master') menuStack=[{type:'root',title:'Manual'},{type:'master',title:'Master Reference'}];
  openDrawer();
}

document.getElementById('menuBtn').onclick = openDrawer;
document.getElementById('drawerClose').onclick = closeDrawer;
drawerBack.onclick = () => {
  if(menuStack.length>1) menuStack.pop();
  renderDrawer();
};
drawerSearch.oninput = e => renderDrawerItems(e.target.value);
overlay.addEventListener('click', e => {
  if(e.target===overlay) closeDrawer();
});

// No cover/first page: Vehicle Information is the default content.
if(!restore()) renderSimplePage('vehicle');
</script>
</body>
</html>
